version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 24
        - 'test -n "${VITE_API_BASE_URL:-}" || { echo "Defina VITE_API_BASE_URL nas variáveis do Amplify."; exit 1; }'
        - npm ci --include=dev --cache .npm --prefer-offline
    build:
      commands:
        - npm test
        - npx tsc --noEmit
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
